name: plugin updates

on:
  workflow_dispatch:
  schedule:
    # run once a week on Wednesday
    - cron: '30 3 * * 3'

jobs:
  vim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: update vim plugins
        run: cd config/vim && make update-plugins

      - name: commit and push changes
        run: |
          git config user.name Github Actions
          git config user.email actions@noreply.github.com
          git add config/vim/pack
          git commit --allow-empty -m "update vim plugins"
          git push

  tmux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: update tmux plugins
        run: cd config/tmux && make update-plugins

      - name: commit and push changes
        run: |
          git config user.name Github Actions
          git config user.email actions@noreply.github.com
          git add config/tmux/plugins
          git commit --allow-empty -m "update tmux plugins"
          git push

